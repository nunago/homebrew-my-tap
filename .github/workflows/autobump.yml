# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 22:45 UTC
    - cron: 45 22 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: Bump formulae and casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          outdated="$(
            brew livecheck --tap="$TAP_NAME" --newer-only --json --quiet |
              jq -r '.[] | select(.version.outdated) | [if .cask then "cask" else "formula" end, .cask // .formula, .version.latest] | @tsv'
          )"

          failed=0
          while IFS=$'\t' read -r type name version; do
            [[ -n "$name" ]] || continue
            brew "bump-${type}-pr" --write-only --commit --version="$version" "$TAP_NAME/$name" || {
              echo "::error::Failed to bump $name to $version"
              git -C "$TAP_PATH" reset --hard HEAD
              failed=1
            }
          done <<< "$outdated"

          if [[ -z "$(git -C "$TAP_PATH" rev-list origin/main..HEAD)" ]]; then
            echo "Nothing to push"
            exit "$failed"
          fi

          # Pushes made with GITHUB_TOKEN don't trigger tests.yml, so run its checks here.
          brew test-bot --only-tap-syntax --tap="$TAP_NAME" || {
            echo "::error::Tap syntax checks failed; not pushing bumps"
            exit 1
          }

          git -C "$TAP_PATH" push origin HEAD:main
          exit "$failed"
